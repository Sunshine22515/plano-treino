# Gera um .apk de teste quando alguém pede, pela aba Actions ou com "gh workflow run".
# Ao publicar uma release, gera o .apk e o anexa a ela.
name: Build Android

on:
  workflow_dispatch:
  release:
    types: [published]

# "write" permite anexar o arquivo à release. O token só vale durante esta execução.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar o Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar o Capacitor
        run: npm install

      # Só a pasta web vai para dentro do app, conforme o capacitor.config.json.
      - name: Criar o projeto Android
        run: npx cap add android

      - name: Compilar o .apk
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Guardar o .apk para download
        uses: actions/upload-artifact@v7
        with:
          name: plano-treino-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Este passo só roda em releases. O nome da etiqueta entra por variável, nunca direto no comando.
      - name: Anexar o .apk à release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ github.event.release.tag_name }}
        run: |
          arquivo="plano-treino-${ETIQUETA//\//-}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$arquivo"
          gh release upload "$ETIQUETA" "$arquivo" --clobber
