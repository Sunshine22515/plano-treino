<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plano de Treino</title>
  <meta name="description" content="Monte seu plano de treino escolhendo entre vários exercícios.">
  <meta name="theme-color" content="#101411">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topo">
    <h1>Plano de Treino</h1>
    <div id="sessao" class="sessao" hidden>
      <span id="nome-usuario" class="nome-usuario"></span>
      <button type="button" id="sair">Sair</button>
    </div>
  </header>

  <p id="aviso" class="aviso" role="alert" hidden></p>

  <section id="tela-entrar" class="painel conta" aria-labelledby="titulo-entrar" hidden>
    <h2 id="titulo-entrar">Entre na sua conta</h2>
    <form id="form-entrar" novalidate>
      <label class="busca-rotulo" for="entrar-usuario">Nome de usuário</label>
      <input type="text" id="entrar-usuario" class="busca" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label class="busca-rotulo" for="entrar-senha">Senha</label>
      <input type="password" id="entrar-senha" class="busca" autocomplete="current-password" required>
      <div class="conta-acoes">
        <button type="submit" class="adicionar">Entrar</button>
        <button type="button" data-ir-para="cadastro">Criar conta</button>
      </div>
      <button type="button" id="esqueci-senha" class="botao-texto" data-ir-para="recuperar">Esqueci minha senha</button>
    </form>
  </section>

  <section id="tela-cadastro" class="painel conta" aria-labelledby="titulo-cadastro" hidden>
    <h2 id="titulo-cadastro">Crie sua conta</h2>
    <form id="form-cadastro" novalidate>
      <label class="busca-rotulo" for="cadastro-usuario">Nome de usuário (3 a 20 letras, números ou _)</label>
      <input type="text" id="cadastro-usuario" class="busca" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <div id="campo-email">
        <label class="busca-rotulo" for="cadastro-email">E-mail (só para confirmações)</label>
        <input type="email" id="cadastro-email" class="busca" autocomplete="email" required>
      </div>
      <label class="busca-rotulo" for="cadastro-senha">Senha (mínimo de 8 caracteres)</label>
      <input type="password" id="cadastro-senha" class="busca" autocomplete="new-password" minlength="8" required>
      <label class="busca-rotulo" for="cadastro-confirmar">Confirme a senha</label>
      <input type="password" id="cadastro-confirmar" class="busca" autocomplete="new-password" minlength="8" required>
      <button type="submit" class="adicionar salvar-senha">Criar conta</button>
      <button type="button" class="botao-texto" data-ir-para="entrar">Já tenho conta</button>
    </form>
  </section>

  <section id="tela-recuperar" class="painel conta" aria-labelledby="titulo-recuperar" hidden>
    <h2 id="titulo-recuperar">Recupere sua senha</h2>
    <form id="form-recuperar" novalidate>
      <label class="busca-rotulo" for="recuperar-email">E-mail da conta</label>
      <input type="email" id="recuperar-email" class="busca" autocomplete="email" required>
      <button type="submit" class="adicionar salvar-senha">Enviar link</button>
      <button type="button" class="botao-texto" data-ir-para="entrar">Voltar para o login</button>
    </form>
  </section>

  <section id="tela-nova-senha" class="painel conta" aria-labelledby="titulo-nova-senha" hidden>
    <h2 id="titulo-nova-senha">Crie uma nova senha</h2>
    <form id="form-nova-senha" novalidate>
      <label class="busca-rotulo" for="nova-senha">Nova senha (mínimo de 8 caracteres)</label>
      <input type="password" id="nova-senha" class="busca" autocomplete="new-password" minlength="8" required>
      <button type="submit" class="adicionar salvar-senha">Salvar nova senha</button>
    </form>
  </section>

  <main id="tela-app" class="app" hidden>
    <section class="painel" aria-labelledby="titulo-plano">
      <div class="painel-topo">
        <h2 id="titulo-plano">Meu plano</h2>
        <span id="total-plano" class="total"></span>
      </div>
      <p id="plano-vazio" class="vazio">Seu plano está vazio. Adicione exercícios da lista.</p>
      <ul id="plano" class="lista"></ul>
      <button type="button" id="limpar-plano" class="botao-texto">Limpar plano</button>
      <button type="button" id="excluir-conta" class="botao-texto">Excluir minha conta</button>
    </section>

    <section class="painel" aria-labelledby="titulo-catalogo">
      <div class="painel-topo">
        <h2 id="titulo-catalogo">Exercícios</h2>
        <span id="total-catalogo" class="total" role="status"></span>
      </div>
      <label class="busca-rotulo" for="busca">Buscar exercício</label>
      <input type="search" id="busca" class="busca" placeholder="Ex.: agachamento" autocomplete="off">
      <div id="grupos" class="grupos" role="group" aria-label="Filtrar por grupo muscular"></div>
      <p id="catalogo-vazio" class="vazio" hidden>Nenhum exercício encontrado.</p>
      <ul id="catalogo" class="lista"></ul>
    </section>
  </main>

  <footer class="rodape">v0.3.0</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
